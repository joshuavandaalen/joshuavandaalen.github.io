name: Deploy to GitHub Pages

# Publishes every site in the repository:
#   /           the component-library documentation site
#   /quiz/      the DevOps Dojo demo app
#   /retro/     the original DDD Melbourne 90s site, preserved
#   /storybook/ the component workbench
#
# NOTE: this requires Settings → Pages → Source = "GitHub Actions".
# A workflow cannot set that itself; deployment fails until it is set.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the UI kit
        run: npm run build --workspace packages/retro-ui

      - name: Build the documentation site
        run: npm run build --workspace apps/docs

      - name: Build the quiz app
        run: npm run build --workspace apps/quiz

      - name: Build Storybook
        run: npm run build-storybook --workspace packages/retro-ui

      # Stitches all four sites together, writes the SPA fallback and the
      # .nojekyll marker, and fails if any expected file is missing.
      - name: Assemble the site
        run: node scripts/build-pages.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
