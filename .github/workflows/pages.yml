name: Deploy

# Publishes every site in the repository to GitHub Pages:
#
#   /            the component-library documentation site
#   /quiz/       the DevOps Dojo demo app
#   /retro/      the original DDD Melbourne 90s site, preserved
#   /storybook/  the component workbench
#
# ── ONE-TIME SETUP ───────────────────────────────────────────────────────────
# Pages must be told to take its content from Actions. Either:
#
#   a) Settings → Pages → Source → "GitHub Actions"   (30 seconds, do this), or
#   b) add a PAT with `repo` + `workflow` scope as the secret PAGES_TOKEN,
#      and this workflow will enable Pages itself on the next run.
#
# The default GITHUB_TOKEN cannot enable Pages — that is a GitHub restriction,
# not an oversight here. The preflight job below fails with instructions rather
# than letting the deploy die with an opaque "Not Found".
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  # Deploy any branch on demand — useful for previewing a large PR before merge.
  workflow_dispatch:
    inputs:
      skip_verification:
        description: Skip the post-deploy smoke test
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running publish: a half-deployed site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build every site
        uses: ./.github/actions/build-site

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Verify the artifact *before* it is published. Deploying something that
      # has never been opened in a browser is how a green pipeline ships a
      # broken site.
      - name: Verify the artifact in a browser
        run: |
          npm run serve:dist &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4173/; then break; fi
            if [ "$i" = "30" ]; then
              echo "::error::Static server never came up on :4173"
              exit 1
            fi
            sleep 1
          done

          npm run e2e -- http://localhost:4173

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5
        with:
          # Enables Pages automatically when a PAT is available. Harmless when
          # Pages is already enabled, and skipped entirely without the secret.
          enablement: ${{ secrets.PAGES_TOKEN != '' }}
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Explain a Pages configuration failure
        if: failure() && steps.configure.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::Settings → Pages → Source → 'GitHub Actions'. Alternatively add a PAT with repo+workflow scope as the PAGES_TOKEN secret and re-run. The default GITHUB_TOKEN is not permitted to enable Pages."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
        if: ${{ !inputs.skip_verification }}

      - uses: actions/setup-node@v4
        if: ${{ !inputs.skip_verification }}
        with:
          node-version-file: .nvmrc

      # `deploy-pages` succeeding only means the CDN accepted the artifact. It
      # says nothing about whether the site works. This hits the real URLs and
      # fails the run if any of them is wrong, retrying while Pages propagates.
      - name: Verify the live deployment
        if: ${{ !inputs.skip_verification }}
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Deployment"
            echo
            echo "| Site | URL |"
            echo "| --- | --- |"
            URL="${{ steps.deployment.outputs.page_url }}"
            echo "| Documentation | ${URL} |"
            echo "| Quiz demo | ${URL}quiz/ |"
            echo "| 1997 original | ${URL}retro/ |"
            echo "| Storybook | ${URL}storybook/ |"
          } >> "$GITHUB_STEP_SUMMARY"
